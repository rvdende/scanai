[package]
name = "scanai"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "Watches a network scanner, saves every scan, then OCRs and classifies it with a local vision model"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rvdende/scanai"
readme = "README.md"
keywords = ["scanner", "ocr", "escl", "documents", "ollama"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
gethostname = "1.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imagesize = "0.15.0"
log = "0.4.35"
oar-ocr = { version = "0.10.2", features = ["auto-download"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
ron = "0.12.3"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
uuid = { version = "1.29.2", features = ["v4"] }
